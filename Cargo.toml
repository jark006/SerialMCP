[package]
name = "serial-mcp"
version = "0.4.9"
edition = "2024"
description = "Agent-oriented UART MCP server for terminal sessions and binary devices on Windows"
license = "MIT"

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
zmodem2 = "0.7"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
