[package]
name = "serial-mcp"
version = "0.1.0"
edition = "2024"
description = "Windows x64 serial-port MCP stdio server for embedded UART consoles"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
